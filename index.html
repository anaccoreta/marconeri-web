<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco Neri | Under Construction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0202; /* Fondo rojo casi negro */
            color: #e0e0e0;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.5rem;
            color: #ff3333; /* Acento rojo brillante */
            font-family: 'VT323', monospace;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .status-text {
            font-size: 1.2rem;
            color: #a0a0a0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Red geométrica sutil de fondo */
        .grid-background {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 51, 51, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>
    <div class="container">
        <h1>MARCO NERI</h1>
        <h2>Sound Creator | Music Tech</h2>
        <p class="status-text">[ SYSTEM UPGRADING - SITE UNDER CONSTRUCTION ]</p>
    </div>
</body>
</html>
